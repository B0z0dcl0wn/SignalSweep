; =============================================================================
; SignalSweep Firmware - XIAO ESP32-S3
;
; One codebase, one env per hardware tier. Shared config lives in [common];
; each tier extends it and adds build_flags/lib_deps for the hardware it has.
; Compile-time flags (HAS_*) decide what code links; runtime probes (see
; capabilities.h) decide what's actually present. Flash with: flash.py --tier N
; =============================================================================

[common]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_ENABLED=1

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit NeoPixel@^1.12.0

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB

; -- Tier 1: cheap off-the-shelf, phone UI, USB power, external U.FL antenna.
;    The only shipping target today. --
[env:tier1]
extends = common

; -- Tier 2: + screen, battery, second radio (dedicated BLE chip so the ESP32
;    can run WiFi promiscuous full-time). Flags reserve the code seams; the
;    driver code is not written yet, so this builds identically to tier1. --
[env:tier2]
extends = common
build_flags =
    ${common.build_flags}
    -DHAS_SECOND_RADIO
    -DHAS_SCREEN
    -DHAS_BATTERY

; -- Tier 3: ground-up SMT board, buttons, on-device logging, onboard GPS.
;    TinyGPSPlus links only here (GPS is phone-side on Tier 1/2). --
[env:tier3]
extends = common
build_flags =
    ${common.build_flags}
    -DHAS_SECOND_RADIO
    -DHAS_SCREEN
    -DHAS_BATTERY
    -DHAS_GPS
    -DHAS_BUTTONS
lib_deps =
    ${common.lib_deps}
    mikalhart/TinyGPSPlus@^1.1.0
