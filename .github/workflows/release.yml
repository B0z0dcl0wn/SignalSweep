# Builds the firmware + app, publishes the web flasher by force-pushing the
# assembled site to gh-pages (which Pages serves), and attaches the firmware
# binaries to a Release when a v* tag is pushed.
#
# Nothing here is hand-built or hand-uploaded: the .bin files served by the
# flasher are the ones this workflow compiled from the tagged commit.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# contents:write covers both things this workflow writes: the gh-pages branch
# it force-pushes the built site to, and the Release it attaches binaries to.
permissions:
  contents: write

# Never let two deploys race; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # PlatformIO's toolchains and framework packages are the slow part.
      # Only needed for the Android build below.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (tier1)
        run: pio run -e tier1 -d firmware

      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build

      # The signed APK, on tags only. Sideload-only: there is no Play Store
      # listing, so the release asset IS the distribution channel.
      #
      # Skips rather than fails when the keystore secret is absent -- a fork, or
      # this repo before the secret was added -- because a missing signing key
      # must never block the firmware release, which is the primary artifact.
      - name: Build signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 not set - skipping the APK."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Outside the workspace so it cannot be picked up by a glob, archived
          # into an artifact, or committed. Runners are ephemeral, but the
          # keystore still gets the shortest life we can give it.
          KS="$(mktemp -d)/signing.jks"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"

          # Both of these must reach the Gradle process itself. The other
          # three secrets are in this step's env: block and so are already
          # exported; these two are computed here, and without exporting them
          # build.gradle sees no keystore, signs nothing, and takes the version
          # from its local fallback instead of the tag.
          export ANDROID_KEYSTORE_PATH="$KS"
          export SIGNALSWEEP_VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$SIGNALSWEEP_VERSION"

          ( cd app && npx cap sync android )
          ( cd app/android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease )

          APK=$(find app/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          case "$APK" in
            *unsigned*) echo "APK is UNSIGNED - the keystore was not applied"; exit 1;;
          esac

          # An APK that will not install is worse than no APK: verify the
          # signature before it is ever published.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

          # Deliberately NOT inside _site: that tree is force-pushed to
          # gh-pages, and publishing the APK there would duplicate the release
          # asset, add megabytes to every site deploy, and mint a
          # version-stamped URL that is stale the moment the next tag lands.
          # The Release asset is the one canonical download.
          mkdir -p dist-apk
          cp "$APK" "dist-apk/SignalSweep-${VERSION}.apk"
          shred -u "$KS" 2>/dev/null || rm -f "$KS"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "apk=dist-apk/SignalSweep-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp site/index.html site/manifest.json site/favicon.svg _site/
          cp -r app/dist _site/app

          B=firmware/.pio/build/tier1
          cp "$B/bootloader.bin" _site/firmware/bootloader.bin
          cp "$B/partitions.bin" _site/firmware/partitions.bin
          cp "$B/firmware.bin"   _site/firmware/signalsweep.bin

          # boot_app0.bin ships with the Arduino framework package, not the build.
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          test -n "$BOOT_APP0" || { echo "boot_app0.bin not found"; exit 1; }
          cp "$BOOT_APP0" _site/firmware/boot_app0.bin

          # Fail loudly if the manifest references a file we did not produce.
          python - <<'PY'
          import json, pathlib, sys
          m = json.load(open('site/manifest.json'))
          missing = [p['path'] for b in m['builds'] for p in b['parts']
                     if not pathlib.Path('_site', p['path']).is_file()]
          if missing:
              sys.exit('manifest references missing files: ' + ', '.join(missing))
          print('manifest parts all present')
          PY

      - name: Stamp manifest version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          python - "$V" <<'PY'
          import json, sys
          p = '_site/manifest.json'
          m = json.load(open(p))
          m['version'] = sys.argv[1]
          json.dump(m, open(p, 'w'), indent=2)
          print('manifest version ->', sys.argv[1])
          PY

      # Publish by force-pushing the assembled tree to gh-pages, which is what
      # Pages serves. Deliberately NOT actions/deploy-pages: that requires the
      # Pages source to be "GitHub Actions", which pins the github-pages
      # environment to a single branch and rejects deployments from main
      # ("Branch main is not allowed to deploy to github-pages due to
      # environment protection rules"). Pushing the branch has no such gate.
      - name: Publish site to gh-pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        working-directory: _site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          touch .nojekyll   # serve the tree verbatim; no Jekyll processing
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "published $(git rev-parse --short HEAD) to gh-pages"

      - name: Attach binaries to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _site/firmware/*.bin
            _site/manifest.json
            dist-apk/*.apk
          generate_release_notes: true
